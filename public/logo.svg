<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">Where it Grows</title>
  <defs>
    <linearGradient id="wig-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17573f"/>
      <stop offset="1" stop-color="#0a2b20"/>
    </linearGradient>
    <linearGradient id="wig-leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3cbd7c"/>
      <stop offset="1" stop-color="#a3f2c4"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#wig-bg)"/>
  <!-- coin -->
  <ellipse cx="32" cy="50" rx="16.5" ry="5.4" fill="#b07d1c"/>
  <rect x="15.5" y="44.6" width="33" height="5.4" fill="#b07d1c"/>
