  <ellipse cx="32" cy="44.6" rx="10.5" ry="3.1" fill="none" stroke="#d6a131" stroke-width="1.5"/>
  <!-- stem (tip hidden under the leaf) -->
  <path d="M32 45.4 C32 39 31.6 32.4 35.2 25.6" fill="none" stroke="#7fdca8" stroke-width="3.4" stroke-linecap="butt"/>
  <!-- leaves: bases taper into the stem -->
  <path d="M32.6 34.6 C28.4 27.2 20 24.7 13.2 26.6 C16.2 34.3 24.6 38.1 32.6 34.6 Z" fill="#46c486"/>
  <path d="M32.4 28.6 C35.4 15.6 46.6 10 54.5 11 C53.6 20.8 45 29.8 32.4 28.6 Z" fill="url(#wig-leaf)"/>
  <path d="M34.6 26.4 C40.5 21.2 46.5 16.6 51.8 13.6" fill="none" stroke="#0b3a2a" stroke-opacity=".28" stroke-width="1.3" stroke-linecap="round"/>
</svg>
